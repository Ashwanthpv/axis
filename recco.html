<body>

<header>
    <h2>AXIS BANK</h2>
    <a href="index.html" class="home">⌂ Home</a>
</header>

<div class="container">
    <div class="card">

        <h1>Customer Profile</h1>
        <p class="subtitle">
            Understand your customer's banking relationship
            and find a suitable account.
        </p>

        <form onsubmit="recommend(event)">

            <label for="name">Customer Name</label>
            <input type="text" id="name"
                   placeholder="Enter full name" required>

            <label for="age">Age</label>
            <input type="number" id="age"
                   placeholder="Enter age" min="18" max="120" required>

            <!-- <label for="relationship">Total Relationship with Bank</label>
            <select id="relationship" required>
                <option value="">Select relationship duration</option>
                <option>Less than 1 laclk</option>
                <option>1–3 lack</option>
                <option>3–15 lack</option>
               <option>15–30 lack</option>
                <option>More than 10 years</option>
            </select> -->

            <label for="balance">Average Monthly Balance (₹)</label>
            <input type="number" id="balance"
                   placeholder="e.g. 75000" min="0"
                   step="0.01" required>

            <button type="submit">Find Recommended Account →</button>

        </form>

        <div id="result" aria-live="polite"></div>

    </div>
</div>

<footer>
    Customer Profiling Portal | Banking Relationship Management
</footer>

<script>
function recommend(event) {
    event.preventDefault();

    let name = document.getElementById("name").value.trim();
    let age = Number(document.getElementById("age").value);
    let relationship = document.getElementById("relationship").value;
    let balance = Number(document.getElementById("balance").value);

    let account;

    if (balance >= 1000000) {
        account = "Burgundy Account";
    } else if (balance >= 200000) {
        account = "Priority Account";
    } else if (balance >= 75000) {
        account = "Prestige Account";
    } else if (balance >= 25000) {
        account = "Liberty Account";
    } else {
        account = "No account recommendation based on the given thresholds";
    }

    document.getElementById("result").style.display = "block";

    document.getElementById("result").innerHTML = `
        <h3>✓ Customer Profile Summary</h3>
        <p><b>Name:</b> ${escapeHTML(name)}</p>
        <p><b>Age:</b> ${age}</p>
        <p><b>Bank Relationship:</b> ${escapeHTML(relationship)}</p>
        <p><b>Average Monthly Balance:</b>
        ₹${balance.toLocaleString("en-IN")}</p>
        <hr>
        <p><b>Recommended Account</b></p>
        <div class="account">${account}</div>
        <p>Recommendation based on your specified balance thresholds.</p>
    `;

    document.getElementById("result").scrollIntoView({
        behavior: "smooth",
        block: "nearest"
    });
}

function escapeHTML(value) {
    return value.replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        }[char];
    });
}
</script>

</body>
</html>
